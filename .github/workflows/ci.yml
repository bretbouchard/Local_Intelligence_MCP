name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          swift --version

      - name: Build
        run: swift build

      - name: Build consumer
        run: swift build --product LocalIntelligenceConsumer

      - name: Run tests (with coverage)
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov report \
            --instr-profile .build/debug/codecov/default.profdata \
            $(swift build --show-bin-path)/LocalIntelligenceMCPTests.xctest/Contents/MacOS/LocalIntelligenceMCPTests \
            Sources/LocalIntelligenceMCP > coverage.txt || true
          cat coverage.txt | tail -5

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

      - name: Live model evals (best-effort)
        continue-on-error: true
        run: ./scripts/run_model_evals.sh
