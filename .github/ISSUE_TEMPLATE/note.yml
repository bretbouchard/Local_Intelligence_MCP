name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.

  - type: input
    id: local-id
    attributes:
      label: Local Tracking ID
      description: If you created a local tracking file, enter the ID
      placeholder: "FEATURE-20260822-001"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature or enhancement do you want?
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: When and why would you use this?
      placeholder: |
        1. Use case 1
        2. Use case 2
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 - High
        - P2 - Medium
        - P3 - Low
    validations:
      required: true

  - type: input
    id: gsd-phase
    attributes:
      label: Related GSD Phase
      description: Which phase would this fit in?
      placeholder: "Phase 3"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other ways to achieve this goal
    validations:
      required: false
