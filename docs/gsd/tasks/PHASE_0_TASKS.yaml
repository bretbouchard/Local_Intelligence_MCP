      test: "Each scheme builds successfully"

- task_id: "0.3.3"
  name: "Isolate SDK-specific source with availability guards"
  priority: 1
  estimated_time: "40 minutes"
  estimated_tokens: 1000
  
  files:
    create:
      - Sources/LocalIntelligenceMCP/Availability/SDKVersion.swift
  
  dependencies: []
  
  work:
    - step: "Create SDKVersion helper"
      code_hint: |
        public struct SDKVersion {
            public static var supportsTier0: Bool { true }
            public static var supportsTier1: Bool { 
                #if os(macOS)
                if #available(macOS 13.0, *) { return true }
                #endif
                return false
            }
            public static var supportsTier2: Bool {
                #if os(macOS)
                if #available(macOS 15.0, *) { return true }
                #endif
                return false
            }
        }
    - step: "Add tests"
  
  verification:
    commands:
      - cmd: "swift build"
        expected_exit: 0
      - cmd: "swift test --filter SDKVersionTests"
        expected_exit: 0
  
  acceptance_criteria:
    - criterion: "Availability helper works"
      test: "Tests pass on current SDK"

