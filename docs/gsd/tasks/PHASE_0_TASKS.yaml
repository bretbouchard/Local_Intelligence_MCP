- task_id: "0.1.1"
  name: "Enumerate all registered MCP tools"
  priority: 1
  estimated_time: "20 minutes"
  estimated_tokens: 600
  
  files:
    create:
      - scripts/enumerate_tools.swift
      - docs/inventory/tool_registry.json
    modify: []
  
  dependencies: []
  
  preconditions:
    build:
      - "swift build succeeds"
  
  work:
    - step: "Create Swift script to introspect tool registry"
      code_hint: "Use reflection or registry inspection"
    - step: "Output JSON with tool names, schemas, descriptions"
      code_hint: "Codable struct for output"
    - step: "Include parameter schemas and return types"
  
  verification:
    commands:
      - cmd: "swift scripts/enumerate_tools.swift > docs/inventory/tool_registry.json"
        expected_exit: 0
      - cmd: "jq '.tools | length' docs/inventory/tool_registry.json"
        expected_output: "Greater than 0"
  
  acceptance_criteria:
    - criterion: "All MCP tools captured"
      test: "JSON contains expected tool count"
    - criterion: "Schemas are complete"
      test: "Each tool has parameters and return_type"

- task_id: "0.1.2"
  name: "Classify each tool by implementation type"
  priority: 1
  estimated_time: "30 minutes"
  estimated_tokens: 800
  
  files:
    create:
      - scripts/classify_tools.swift
    modify:
      - docs/inventory/tool_registry.json
  
  dependencies:
    - task_id: "0.1.1"
      reason: "Needs tool list"
  
  work:
    - step: "Read tool_registry.json"
    - step: "For each tool, analyze implementation"
    - step: "Classify as: deterministic, genuine_side_effect, simulated, stub, optional, deprecated, unknown"
    - step: "Add 'classification' field to each tool"
    - step: "Add 'reason' field explaining classification"
  
  verification:
    commands:
      - cmd: "swift scripts/classify_tools.swift"
        expected_exit: 0
      - cmd: "jq '.tools[] | select(.classification == null)' docs/inventory/tool_registry.json"
        expected_output: "Empty (all classified)"
  
  acceptance_criteria:
    - criterion: "Every tool has classification"
      test: "No null classifications in JSON"
    - criterion: "Simulated tools identified"
      test: "Shortcuts and Voice Control marked as 'simulated'"

