      - Tests/ErrorTests/CapabilityErrorTests.swift
  
  dependencies: []
  
  work:
    - step: "Define enum CapabilityError: Error"
      code_hint: |
        public enum CapabilityError: Error {
            case unavailable(capability: String, reason: String)
            case unsupported(capability: String)
            case permissionDenied(capability: String)
            case notReady(capability: String, status: String)
        }
    - step: "Add CustomStringConvertible conformance"
    - step: "Add unit tests"
  
  verification:
    commands:
      - cmd: "swift build"
        expected_exit: 0
      - cmd: "swift test --filter CapabilityErrorTests"
        expected_exit: 0
  
  acceptance_criteria:
    - criterion: "Error type compiles"
      test: "Build succeeds"
    - criterion: "Error messages clear"
      test: "Tests verify descriptions"

