      - .swiftpm/xcode/xcshareddata/xcschemes/LocalIntelligenceMCP-Tier1.xcscheme
  
  dependencies: []
  
  work:
    - step: "Add conditional compilation flags"
      code_hint: "swiftSettings: [.define('TIER_0_ONLY')]"
    - step: "Create build schemes for each tier"
